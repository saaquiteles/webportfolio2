name: Deploy to GitHub Pages

# Deploying is on hold (ADR 0007), so this runs only when started by hand.
# Re-add `push:` with `branches: [main]` under `on:` when deploying resumes.
on:
  workflow_dispatch:

permissions:
  contents: read

# Let a running deploy finish; a newer push waits instead of cutting it off half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          # Leave the variable unset for user.github.io or a custom domain.
          # Set it to /<repo> for a project page (user.github.io/<repo>).
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only this job publishes, so only it gets the Pages and identity-token scopes.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
